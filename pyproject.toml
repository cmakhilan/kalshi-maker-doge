[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kxdoge-backtest"
version = "0.1.0"
description = "Settlement-aware probability backtests for Kalshi KXDOGE15M markets"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0",
  "scipy>=1.12",
]

[project.scripts]
kxdoge-backtest = "kxdoge_backtest.cli:main"
kxdoge-maker-backtest = "kxdoge_backtest.maker_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
